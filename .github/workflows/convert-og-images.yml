name: Convert OG SVG → PNG

on:
  push:
    paths:
      - 'og-*.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install librsvg
        run: sudo apt-get install -y librsvg2-bin

      - name: Convert all og-*.svg to PNG (1200×630)
        run: |
          for f in og-*.svg; do
            out="${f%.svg}.png"
            rsvg-convert -w 1200 -h 630 "$f" -o "$out"
            echo "✓ $f → $out"
          done

      - name: Commit PNGs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add og-*.png
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-generate OG PNG images from SVG [skip ci]"
          git push
